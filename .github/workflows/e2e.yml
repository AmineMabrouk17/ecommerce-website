name: E2E

on:
  push:
    branches: [main]
  # pull_request:             # disabled — too slow for PRs; runs on push to main only

jobs:
  e2e:
    name: E2E suite (chromium, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The db:seed and db:e2e-users scripts run with --env-file=.env.local,
      # and the app reads NEXT_PUBLIC_* at build/runtime, so .env.local must
      # contain every value the suite needs. Set these secrets in the
      # repository:
      #   NEXT_PUBLIC_SITE_URL
      #   NEXT_PUBLIC_SUPABASE_URL
      #   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
      #   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
      #   SUPABASE_SERVICE_ROLE_KEY
      #   STRIPE_SECRET_KEY
      #   STRIPE_WEBHOOK_SECRET
      # The single-quoted heredoc keeps the secrets from being expanded by the
      # shell; GitHub substitutes the ${{ secrets.* }} expressions first.
      - name: Write .env.local from secrets
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          EOF

      - name: Seed the database
        run: npm run db:seed

      - name: Ensure E2E users
        run: npm run db:e2e-users

      - name: Run the E2E suite (headless)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
